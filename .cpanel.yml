---
# cPanel Git™ Version Control deployment for Phar Lap 2, at the ROOT of smartnfts.com.
#
# In cPanel → Git Version Control, open this repository (branch: main) and click "Deploy HEAD Commit".
# cPanel runs the tasks below.
#
# DEPLOYPATH is the smartnfts.com document root, as cPanel → Domains states it ("/smartnfts.com", relative to
# home). The first task stops the deploy if it is not there, so nothing lands anywhere else.
#
# Phar Lap 2 takes the place of Phar Lap 1 here. It imports Phar Lap 1's wallet from this site's storage and never
# writes or deletes Phar Lap 1's items, so deploying Phar Lap 1's HEAD again restores it as it was. Phar Lap 1's own
# files (bundle.js) are left in place. The data folders (og/, links/) are kept: existing short links and previews
# keep working.
#
# The app runs as the files in this repository, with no build: src/, impl/js/ and vendor/ are copied as they are.
# index.html names each one with its hash, so it goes last: until then the old page, and the old files it names,
# stay whole. testbundle2.js, which the old page loads, is left in place.
deployment:
  tasks:
    - export DEPLOYPATH="$HOME/smartnfts.com/"
    - test -d "$DEPLOYPATH" || exit 1
    - /bin/cp .htaccess "$DEPLOYPATH"
    - /bin/mkdir -p "$DEPLOYPATH/src" "$DEPLOYPATH/impl/js/data" "$DEPLOYPATH/vendor/noble-hashes"
    - /bin/cp src/*.js "$DEPLOYPATH/src/"
    - /bin/cp impl/js/*.mjs "$DEPLOYPATH/impl/js/"
    - /bin/cp impl/js/data/*.mjs "$DEPLOYPATH/impl/js/data/"
    - /bin/cp vendor/noble-hashes/* "$DEPLOYPATH/vendor/noble-hashes/"
    - /bin/cp jsqr.min.js "$DEPLOYPATH"
    - /bin/cp -R brand "$DEPLOYPATH"
    - /bin/cp share.php "$DEPLOYPATH"
    - /bin/cp register.php "$DEPLOYPATH"
    - /bin/cp shorten.php "$DEPLOYPATH"
    - /bin/cp LICENSE "$DEPLOYPATH"
    - /bin/cp NOTICE "$DEPLOYPATH"
    - /bin/mkdir -p "$DEPLOYPATH/og"
    - /bin/mkdir -p "$DEPLOYPATH/links"
    - /bin/cp index.html "$DEPLOYPATH"
